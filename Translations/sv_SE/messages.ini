strings.altcha.plugin.name="ALTCHA"
strings.altcha.failure_message="ALTCHA-verifieringen misslyckades. Försök igen."

; integration (Plugins -> ALTCHA) settings
strings.altcha.settings.notice="Fyll i antingen HMAC-hemligheten (självhostad, körs helt på den här servern) ELLER de tre Sentinel-fälten nedan (använder en ALTCHA Sentinel-instans för att utfärda utmaningar och ge extra skräppost-/botskydd). Om båda är ifyllda används Sentinel."

strings.altcha.settings.hmac_secret="HMAC-hemlighet (självhostad)"
strings.altcha.settings.hmac_secret.notice="Det här är inte en API-nyckel – den lämnar aldrig din server. Ange en lång, slumpmässig sträng (generera t.ex. med `openssl rand -hex 32`) och håll den hemlig. Mautic använder den för att signera och verifiera utmaningar lokalt; ALTCHA gör aldrig utgående anrop till tredje part. Lämna tomt om du använder ALTCHA Sentinel. Att lämna tomt när du redigerar formuläret behåller det tidigare sparade värdet – det skickas aldrig tillbaka till webbläsaren."
strings.altcha.settings.hmac_secret.placeholder="Lämna tomt för att behålla nuvarande hemlighet"

strings.altcha.settings.sentinel_domain="Sentinel-domän / bas-URL"
strings.altcha.settings.sentinel_domain.notice="Bas-URL:en för din ALTCHA Sentinel-instans, t.ex. https://sentinel.example.com (självhostad) eller URL:en för din ALTCHA Cloud-region. Inkludera inte avslutande snedstreck eller sökväg – Mautic lägger till /v1/challenge automatiskt."

strings.altcha.settings.sentinel_api_key="Sentinel API-nyckel"
strings.altcha.settings.sentinel_api_key.notice="API-nyckelns ID från din Sentinel-apps API-nyckelsektion (ser ut som key_...). Det skickas till besökarens webbläsare som en del av widgetens utmanings-URL, så det är inte i sig hemligt – men det måste tillhöra en säkerhetsgrupp som har tillstånd att utfärda utmaningar."

strings.altcha.settings.sentinel_api_secret="Sentinel API-nyckelhemlighet"
strings.altcha.settings.sentinel_api_secret.notice="Hemligheten för samma API-nyckel, som också visas i Sentinels API-nyckelsektion. Till skillnad från själva API-nyckeln lämnar den här aldrig din server – Mautic använder den endast för att verifiera signaturen Sentinel bifogar varje inlämning, lokalt, utan utgående anrop. Att lämna tomt när du redigerar formuläret behåller det tidigare sparade värdet."
strings.altcha.settings.sentinel_api_secret.placeholder="Lämna tomt för att behålla nuvarande hemlighet"

; field "Properties" tab settings
strings.altcha.settings.complexity="Svårighetsgrad"
strings.altcha.settings.complexity.tooltip="Endast självhostat läge (ignoreras om ALTCHA Sentinel är konfigurerat, eftersom Sentinel styr sin egen svårighetsgrad). Hur mycket proof-of-work besökarens webbläsare behöver beräkna innan formuläret kan skickas. Högre svårighetsgrad ger bättre skräppostskydd men ett något långsammare widget, särskilt på lågpresterande mobilenheter."
strings.altcha.settings.complexity.option.low="Låg"
strings.altcha.settings.complexity.option.medium="Medel"
strings.altcha.settings.complexity.option.high="Hög"

strings.altcha.settings.expire="Utmaningens giltighetstid (sekunder)"
strings.altcha.settings.expire.tooltip="Endast självhostat läge (ignoreras om ALTCHA Sentinel är konfigurerat). Hur länge, i sekunder, en genererad utmaning är giltig. Om en besökare tar längre tid på sig att skicka in formuläret kommer de att bli ombedda att lösa en ny utmaning."

strings.altcha.settings.auto="Börja lösa"
strings.altcha.settings.auto.tooltip="När widgeten ska börja lösa utmaningen automatiskt. \"Vid inlämning\" (rekommenderat) undviker att slösa besökarens CPU om de aldrig skickar formuläret; \"Vid sidladdning\" löser den direkt i bakgrunden så att inlämning känns omedelbar; \"Av\" kräver att besökaren klickar i en kryssruta."
strings.altcha.settings.auto.option.onload="Vid sidladdning"
strings.altcha.settings.auto.option.onsubmit="Vid inlämning"
strings.altcha.settings.auto.option.off="Av (manuell)"

strings.altcha.settings.display="Visningsläge"
strings.altcha.settings.display.tooltip="Hur widgeten visas. \"Standard\" är en inbäddad ruta; \"Stapel\" är ett smalt fält; \"Flytande\" placerar ett litet märke nära skicka-knappen; \"Överlagring\" öppnar en modal vid behov; \"Osynlig\" visar inget gränssnitt alls om inte en kodutmaning krävs."
strings.altcha.settings.display.option.standard="Standard (inbäddad ruta)"
strings.altcha.settings.display.option.bar="Stapel"
strings.altcha.settings.display.option.floating="Flytande"
strings.altcha.settings.display.option.overlay="Överlagring"
strings.altcha.settings.display.option.invisible="Osynlig"

strings.altcha.settings.hide_footer="Dölj sidfot"
strings.altcha.settings.hide_logo="Dölj ALTCHA-logotyp"

