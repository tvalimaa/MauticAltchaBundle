strings.altcha.failure_message="ALTCHA-varmistus epäonnistui. Yritä uudelleen."

; integration (Plugins -> ALTCHA) settings
strings.altcha.settings.notice="Täytä joko HMAC-salaisuus (oma palvelin, toimii kokonaan tällä palvelimella) TAI alla olevat kolme Sentinel-kenttää (käyttää ALTCHA Sentinel -instanssia haasteiden myöntämiseen ja lisäsuojaukseen roskapostia vastaan). Jos molemmat on täytetty, Sentinel on käytössä."

strings.altcha.settings.hmac_secret="HMAC-salaisuus (oma palvelin)"
strings.altcha.settings.hmac_secret.notice="Tämä ei ole API-avain – se ei koskaan poistu palvelimeltasi. Aseta se pitkäksi satunnaiseksi merkkijonoksi (voit luoda sellaisen esim. komennolla `openssl rand -hex 32`) ja pidä se salassa. Mautic käyttää sitä haasteiden allekirjoittamiseen ja varmentamiseen paikallisesti; ALTCHA ei koskaan lähetä pyyntöjä ulkopuolisille palveluille. Jätä tyhjäksi jos käytät ALTCHA Sentineliä. Tyhjänä jättäminen lomaketta muokatessa säilyttää aiemmin tallennetun arvon – sitä ei koskaan palauteta selaimelle."
strings.altcha.settings.hmac_secret.placeholder="Jätä tyhjäksi säilyttääksesi nykyisen salaisuuden"

strings.altcha.settings.sentinel_domain="Sentinelin domain / URL"
strings.altcha.settings.sentinel_domain.notice="ALTCHA Sentinel -instanssisi perus-URL, esim. https://sentinel.example.com (oma palvelin) tai ALTCHA Cloud -alueesi URL. Älä lisää loppuvinoviivaa tai polkua – Mautic lisää /v1/challenge itse."

strings.altcha.settings.sentinel_api_key="Sentinelin API-avain"
strings.altcha.settings.sentinel_api_key.notice="API-avaimen tunnus Sentinel-sovelluksesi API-avaimet-osiosta (muotoa key_...). Tämä lähetetään käyttäjän selaimelle osana widgetin haaste-URL:ia, joten se ei itsessään ole salainen – mutta sen on kuuluttava suojausryhmään, jolla on oikeus myöntää haasteita."

strings.altcha.settings.sentinel_api_secret="Sentinelin API-avaimen salaisuus"
strings.altcha.settings.sentinel_api_secret.notice="Saman API-avaimen salaisuus, joka näkyy myös Sentinelin API-avaimet-osiossa. Toisin kuin itse API-avain, tämä ei koskaan poistu palvelimeltasi – Mautic käyttää sitä vain Sentinelin lähetyksiin liittämän allekirjoituksen varmentamiseen paikallisesti ilman ulkoisia pyyntöjä. Tyhjänä jättäminen lomaketta muokatessa säilyttää aiemmin tallennetun arvon."
strings.altcha.settings.sentinel_api_secret.placeholder="Jätä tyhjäksi säilyttääksesi nykyisen salaisuuden"

; field "Properties" tab settings
strings.altcha.settings.complexity="Vaikeustaso"
strings.altcha.settings.complexity.tooltip="Vain oma palvelin -tila (ohitetaan jos ALTCHA Sentinel on käytössä, koska Sentinel hallitsee omaa vaikeustasoaan). Kuinka paljon laskentatyötä käyttäjän selaimen on tehtävä ennen lomakkeen lähettämistä. Korkeampi taso tarkoittaa parempaa suojaa roskapostia vastaan, mutta hieman hitaampaa widgettiä etenkin heikkotehoisilla mobiililaitteilla."
strings.altcha.settings.complexity.option.low="Matala"
strings.altcha.settings.complexity.option.medium="Keskitaso"
strings.altcha.settings.complexity.option.high="Korkea"

strings.altcha.settings.expire="Haasteen voimassaoloaika (sekunteina)"
strings.altcha.settings.expire.tooltip="Vain oma palvelin -tila (ohitetaan jos ALTCHA Sentinel on käytössä). Kuinka kauan luotu haaste on voimassa sekunteina. Jos käyttäjä käyttää tätä pidempään lomakkeen täyttämiseen, häntä pyydetään ratkaisemaan uusi haaste."

strings.altcha.settings.auto="Aloita ratkaisu"
strings.altcha.settings.auto.tooltip="Milloin widgetin tulisi aloittaa haasteen ratkaisu automaattisesti. \"Lähetettäessä\" (suositeltu) välttää turhaa suoritintehon käyttöä jos käyttäjä ei koskaan lähetä lomaketta; \"Sivun latautuessa\" ratkaisee sen heti taustalla jolloin lähetys tuntuu välittömältä; \"Ei käytössä\" vaatii käyttäjää rastittamaan valintaruudun."
strings.altcha.settings.auto.option.onload="Sivun latautuessa"
strings.altcha.settings.auto.option.onsubmit="Lähetettäessä"
strings.altcha.settings.auto.option.off="Ei käytössä (manuaalinen)"

strings.altcha.settings.display="Näyttötila"
strings.altcha.settings.display.tooltip="Miten widget näytetään. \"Normaali\" on upotettuna; \"Palkki\" on kapea palkki; \"Kelluva\" lisää pienen merkin lähetyspainikkeen lähelle; \"Peite\" avaa modaalin vain tarvittaessa; \"Näkymätön\" ei näytä mitään käyttöliittymää ellei koodihaasteesta ole kyse."
strings.altcha.settings.display.option.standard="Normaali (upotettu)"
strings.altcha.settings.display.option.bar="Palkki"
strings.altcha.settings.display.option.floating="Kelluva"
strings.altcha.settings.display.option.overlay="Peite"
strings.altcha.settings.display.option.invisible="Näkymätön"

strings.altcha.settings.hide_footer="Piilota alatunniste"
strings.altcha.settings.hide_logo="Piilota ALTCHA-logo"

